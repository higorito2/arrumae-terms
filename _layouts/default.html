<!doctype html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f3">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Arrumaê — documentos legais">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span>Arrumaê</span>
        </a>
        <nav aria-label="Documentos legais">
          <a href="{{ '/terms/' | relative_url }}">Termos</a>
          <a href="{{ '/privacy/' | relative_url }}">Privacidade</a>
          <a href="{{ '/account-deletion/' | relative_url }}">Excluir conta</a>
        </nav>
      </div>
    </header>

    <main id="conteudo" class="shell page-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <span>© {{ 'now' | date: '%Y' }} Arrumaê</span>
        <a href="mailto:higor.pereira.dev@gmail.com">Contato</a>
      </div>
    </footer>
  </body>
</html>
